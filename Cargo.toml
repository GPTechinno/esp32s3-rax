[package]
name = "esp32s3-rax"
version = "0.1.0"
edition = "2024"
description = "ESP32-S3 SoC emulator: rax's Xtensa LX7 core with the memory map, the boot from the internal ROM, the peripherals and a Wi-Fi network"
repository = "https://github.com/GPTechinno/esp32s3-rax"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
readme = "README.md"
keywords = ["esp32s3", "esp32", "emulator", "xtensa", "wifi"]
categories = ["emulators", "embedded", "simulation"]
include = [
    "/src/**/*.rs",
    "/docs/*.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[bin]]
name = "esp32s3-run"
path = "src/bin/esp32s3-run.rs"

[dependencies]
# rax with its Xtensa interpreter, from a checkout of the `feat/xtensa-esp32s3` branch of
# https://github.com/Georges760/rax; a version goes next to the path once rax is on crates.io
# (its crates.io name: `rax` there is another crate)
rax = { path = "../../upstream/rax", default-features = false }
clap = { version = "4.6", features = ["derive"] }
goblin = "0.10"
sha2 = { version = "0.10", features = ["compress"] }
aes = "0.8"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-dhcpv4"] }
